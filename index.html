<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUTBOSS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            position: relative;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .container {
            text-align: center;
            padding: 0 20px;
            max-width: 640px;
        }
        h1 {
            font-size: 5vw;
            font-weight: bold;
            margin-bottom: 16px;
            line-height: 1.2;
        }
        .subtitle {
            font-size: clamp(1rem, 2vw, 1.35rem);
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
        }
        .description {
            font-size: clamp(0.9rem, 1.4vw, 1.05rem);
            color: #666;
            line-height: 1.6;
        }
        .footer-link {
            position: absolute;
            bottom: 20px;
            font-size: 14px;
            color: #666;
            text-decoration: none;
        }
        .footer-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>CUTBOSS</h1>
        <p class="subtitle">Mobile Application Development</p>
        <p class="description">CUTBOSS develops and publishes mobile applications designed to provide useful tools and practical features for everyday use.</p>
    </main>
    <a href="https://cutboss.work/home/products/policy/privacy.html" class="footer-link">Privacy Policy</a>
</body>
</html>
